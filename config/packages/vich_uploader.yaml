vich_uploader:
    db_driver: orm

    mappings:
        pin_images:
            uri_prefix: /images/pins
            upload_destination: '%kernel.project_dir%/public/images/pins'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        account_images:
            uri_prefix: /images/accounts
            upload_destination: '%kernel.project_dir%/public/images/accounts'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer